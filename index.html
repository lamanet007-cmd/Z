<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zed Mini – dobývání sektorů</title>
<style>
:root{--bg:#e9e6dc;--fg:#23261f;--panel:#d8d4c6;--me:#1f6fb5;--foe:#c4501f;--neu:#8b8a80;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1e18;--fg:#e4e2d6;--panel:#2a2e25;--me:#4aa3e8;--foe:#e8784a;--neu:#7c7b70;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif}
body{padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0);max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding:10px 0}
h1{font-size:1.2rem;margin:0}
#hud{display:flex;gap:14px}
#hud b.me{color:var(--me)}#hud b.foe{color:var(--foe)}
canvas{width:100%;height:auto;display:block;background:var(--panel);border-radius:6px;touch-action:manipulation}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
button{font:inherit;padding:8px 14px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--me);outline-offset:2px}
p.help{margin:0;font-size:.9rem;max-width:70ch}
</style>
</head>
<body>
<header>
  <h1>Zed Mini</h1>
  <div id="hud">Moje roboty: <b class="me" id="nm">0</b> Nepřítel: <b class="foe" id="nf">0</b> Sektory: <b class="me" id="sm">0</b>/<span id="st">0</span></div>
</header>
<canvas id="c" width="960" height="600" aria-label="Herní plocha"></canvas>
<div class="bar">
  <button id="all">Vybrat všechny roboty</button>
  <button id="rst">Nová hra</button>
</div>
<p class="help">Klepni na sektor, ve kterém máš roboty, a vyber je. Pak klepni na cílový sektor. Roboty, kteří v sektoru stojí sami, ho obsadí. Čím víc sektorů vlastníš, tím rychleji jedou tvoje továrny. Vyhraješ, když ovládneš všechny továrny.</p>
<script>
(function(){
var C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=600,COLS=8,ROWS=5,SW=W/COLS,SH=H/ROWS;
var S,U,shots,sel,over,last,aiT,col={};
var FACT=[[0,2],[7,2],[3,0],[4,4],[2,3],[5,1]]; // [sloupec,řádek]
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function init(){
  S=[];U=[];shots=[];sel=null;over=null;aiT=4;
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)S.push({c:c,r:r,o:0,cap:0,who:0,f:false,t:0});
  FACT.forEach(function(f){S[f[1]*COLS+f[0]].f=true});
  S[2*COLS].o=1;S[2*COLS+COLS-1].o=2;
  S.forEach(function(s){s.t=Math.random()*3});
  for(var i=0;i<3;i++){spawn(S[2*COLS],1);spawn(S[2*COLS+COLS-1],2)}
}
function spawn(s,team){
  var x=s.c*SW+20+Math.random()*(SW-40),y=s.r*SH+20+Math.random()*(SH-40);
  U.push({x:x,y:y,tm:team,hp:40,tx:x,ty:y,cd:0,sel:false});
}
function sec(x,y){var c=Math.min(COLS-1,Math.max(0,x/SW|0)),r=Math.min(ROWS-1,Math.max(0,y/SH|0));return S[r*COLS+c]}
function send(list,s){list.forEach(function(u){u.tx=s.c*SW+18+Math.random()*(SW-36);u.ty=s.r*SH+18+Math.random()*(SH-36);u.sel=false})}
function owned(t){return S.filter(function(s){return s.o===t}).length}
function step(dt){
  var i,j,u,v,d,best,bd;
  // továrny
  S.forEach(function(s){
    if(!s.f||!s.o)return;
    s.t-=dt*(1+0.25*owned(s.o));
    if(s.t<=0){s.t=6;if(U.filter(function(q){return q.tm===s.o}).length<70)spawn(s,s.o)}
  });
  // jednotky
  for(i=0;i<U.length;i++){
    u=U[i];u.cd-=dt;best=null;bd=1e9;
    for(j=0;j<U.length;j++){v=U[j];if(v.tm===u.tm)continue;d=Math.hypot(v.x-u.x,v.y-u.y);if(d<bd){bd=d;best=v}}
    if(best&&bd<70){
      if(u.cd<=0){u.cd=0.8;best.hp-=9;shots.push({a:u,b:best,t:0.12})}
    }else{
      d=Math.hypot(u.tx-u.x,u.ty-u.y);
      if(d>3){u.x+=(u.tx-u.x)/d*45*dt;u.y+=(u.ty-u.y)/d*45*dt}
    }
  }
  U=U.filter(function(q){return q.hp>0});
  shots=shots.filter(function(h){h.t-=dt;return h.t>0});
  if(sel&&!U.some(function(q){return q.sel}))sel=null;
  // obsazování
  var cnt=S.map(function(){return[0,0,0]});
  U.forEach(function(q){var s=sec(q.x,q.y);cnt[s.r*COLS+s.c][q.tm]++});
  S.forEach(function(s,k){
    var a=cnt[k][1],b=cnt[k][2],w=a&&!b?1:b&&!a?2:0;
    if(w&&w!==s.o){if(s.who!==w){s.who=w;s.cap=0}s.cap+=dt*(w===1?a:b);if(s.cap>=2){s.o=w;s.cap=0}}
    else s.cap=Math.max(0,s.cap-dt);
  });
  // AI
  aiT-=dt;
  if(aiT<=0){
    aiT=6;
    var foes=U.filter(function(q){return q.tm===2});
    if(foes.length>=3){
      var ax=0,ay=0;foes.forEach(function(q){ax+=q.x;ay+=q.y});ax/=foes.length;ay/=foes.length;
      var tg=null,td=1e9;
      S.forEach(function(s){if(s.o===2)return;var dd=Math.hypot(s.c*SW+SW/2-ax,s.r*SH+SH/2-ay)-(s.f?120:0);if(dd<td){td=dd;tg=s}});
      if(tg)send(foes,tg);
    }
  }
  // konec
  var fs=S.filter(function(s){return s.f});
  if(fs.every(function(s){return s.o===1}))over='Vyhrál jsi! Všechny továrny jsou tvoje.';
  else if(fs.every(function(s){return s.o===2}))over='Prohrál jsi. Nepřítel ovládl všechny továrny.';
}
function draw(){
  var me=css('--me'),foe=css('--foe'),neu=css('--neu'),fg=css('--fg'),pn=css('--panel');
  X.clearRect(0,0,W,H);
  S.forEach(function(s){
    var x=s.c*SW,y=s.r*SH,c=s.o===1?me:s.o===2?foe:neu;
    X.globalAlpha=s.o?0.22:0.08;X.fillStyle=c;X.fillRect(x,y,SW,SH);X.globalAlpha=1;
    X.strokeStyle=fg;X.globalAlpha=0.25;X.lineWidth=1;X.strokeRect(x+.5,y+.5,SW-1,SH-1);X.globalAlpha=1;
    // vlajka
    X.strokeStyle=fg;X.lineWidth=2;X.beginPath();X.moveTo(x+14,y+12);X.lineTo(x+14,y+34);X.stroke();
    X.fillStyle=c;X.beginPath();X.moveTo(x+14,y+12);X.lineTo(x+32,y+18);X.lineTo(x+14,y+24);X.fill();
    if(s.f){X.fillStyle=pn;X.strokeStyle=c;X.lineWidth=3;X.fillRect(x+SW-34,y+10,22,22);X.strokeRect(x+SW-34,y+10,22,22);X.fillStyle=c;X.fillRect(x+SW-28,y+16,10,10)}
    if(s.cap>0){X.fillStyle=s.who===1?me:foe;X.fillRect(x+8,y+SH-10,(SW-16)*Math.min(1,s.cap/2),5)}
    if(sel===s){X.strokeStyle=me;X.lineWidth=3;X.strokeRect(x+3,y+3,SW-6,SH-6)}
  });
  shots.forEach(function(h){X.strokeStyle=h.a.tm===1?me:foe;X.lineWidth=2;X.beginPath();X.moveTo(h.a.x,h.a.y);X.lineTo(h.b.x,h.b.y);X.stroke()});
  U.forEach(function(u){
    var c=u.tm===1?me:foe;
    X.fillStyle=c;X.beginPath();X.arc(u.x,u.y,7,0,6.283);X.fill();
    X.strokeStyle=pn;X.lineWidth=2;X.stroke();
    X.fillStyle=pn;X.fillRect(u.x-2,u.y-3,4,2);
    X.fillStyle=u.hp>20?fg:foe;X.fillRect(u.x-8,u.y-14,16*u.hp/40,3);
    if(u.sel){X.strokeStyle=fg;X.lineWidth=1.5;X.beginPath();X.arc(u.x,u.y,11,0,6.283);X.stroke()}
  });
  if(over){
    X.fillStyle='rgba(0,0,0,.6)';X.fillRect(0,H/2-50,W,100);
    X.fillStyle='#fff';X.font='bold 26px Trebuchet MS,Verdana,sans-serif';X.textAlign='center';X.fillText(over,W/2,H/2+8);X.textAlign='left';
  }
  var m=0,f=0;U.forEach(function(q){q.tm===1?m++:f++});
  document.getElementById('nm').textContent=m;document.getElementById('nf').textContent=f;
  document.getElementById('sm').textContent=owned(1);document.getElementById('st').textContent=S.length;
}
function loop(t){
  var dt=Math.min(0.05,(t-(last||t))/1000);last=t;
  if(!over)step(dt);
  draw();requestAnimationFrame(loop);
}
function pos(e){var r=C.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
C.addEventListener('pointerdown',function(e){
  if(over)return;
  var p=pos(e),s=sec(p[0],p[1]);
  var mine=U.filter(function(u){return u.tm===1&&sec(u.x,u.y)===s});
  if(sel&&U.some(function(u){return u.sel})){
    if(s===sel&&mine.length){U.forEach(function(u){u.sel=false});sel=null;return}
    send(U.filter(function(u){return u.sel}),s);sel=null;
  }else if(mine.length){
    U.forEach(function(u){u.sel=false});mine.forEach(function(u){u.sel=true});sel=s;
  }
});
document.getElementById('all').onclick=function(){
  var mine=U.filter(function(u){return u.tm===1});
  if(!mine.length)return;
  mine.forEach(function(u){u.sel=true});sel=sec(mine[0].x,mine[0].y);
};
document.getElementById('rst').onclick=init;
init();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
