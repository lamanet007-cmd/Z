<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zed Mini – dobývání sektorů</title>
<style>
:root{--bg:#e9e6dc;--fg:#23261f;--panel:#d8d4c6;--me:#1f6fb5;--foe:#c4501f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171a14;--fg:#e4e2d6;--panel:#262a21;--me:#5bb0f0;--foe:#f08a5a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif}
body{padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0);max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:10px 0}
h1{font-size:1.3rem;margin:0;letter-spacing:.02em}
#hud{display:flex;gap:14px;flex-wrap:wrap}
#hud b.me{color:var(--me)}#hud b.foe{color:var(--foe)}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
button{font:inherit;padding:8px 14px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--me);outline-offset:2px}
button[disabled]{opacity:.4;cursor:not-allowed}
p.help{margin:0 0 12px;font-size:.9rem;max-width:70ch}
</style>
</head>
<body>
<header>
  <h1>Zed Mini</h1>
  <div id="hud">Moje roboty: <b class="me" id="nm">0</b> Nepřítel: <b class="foe" id="nf">0</b> Sektory: <b class="me" id="sm">0</b>/<span id="st">0</span></div>
</header>
<canvas id="c" width="960" height="600" aria-label="Herní plocha"></canvas>
<div class="bar" id="ms"></div>
<p class="help" id="md"></p>
<div class="bar">
  <button id="all">Vybrat všechny roboty</button>
  <button id="rst">Nová hra</button>
</div>
<p class="help">Klepni na sektor, ve kterém máš roboty, a vyber je. Pak klepni na cílový sektor. Sektor obsadíš, když v něm stojí jen tvoji roboti. Čím víc sektorů vlastníš, tím rychleji jedou tvoje továrny. Vyhraješ, když ovládneš všechny továrny.</p>
<script>
(function(){

{n:'Průsmyk',d:'Šest továren a vyrovnaný soupeř. Drž střed mapy.',f:[[0,2],[7,2],[3,0],[4,4],[2,3],[5,1]],a:[[0,2]],b:[[7,2]],ai:6,p:1,n1:3,n2:3},
{n:'Obklíčení',d:'Nepřítel začíná se třemi továrnami na pravém kraji. Prorazit středem.',f:[[0,2],[7,2],[7,0],[7,4],[3,2],[4,2]],a:[[0,2]],b:[[7,2],[7,0],[7,4]],ai:5,p:1,n1:4,n2:4},
{n:'Přežití',d:'Vydrž 150 sekund a udrž aspoň jednu továrnu. Nepřítel útočí v rychlých vlnách.',f:[[0,2],[7,2],[3,0],[4,4]],a:[[0,2]],b:[[7,2],[4,4]],ai:3.5,p:1.2,sv:150,n1:5,n2:4},
{n:'Poslední bašta',d:'Čtyři nepřátelské továrny a rychlá výroba. Poslední zkouška.',f:[[0,2],[7,2],[3,0],[4,4],[2,3],[5,1],[3,2],[6,3]],a:[[0,2]],b:[[7,2],[5,1],[6,3],[4,4]],ai:3,p:1.5,n1:3,n2:6}];

function terrain(){

    B.strokeStyle='rgba(60,30,12,.07)';B.lineWidth=6+rnd()*8;B.beginPath();B.moveTo(x,y+10);B.bezierCurveTo(x+r,y-20,x+r*1.5,y+50,x+r*2,y+10);B.stroke()}
  var fp=FACT.slice().sort(function(a,b){return a[0]-b[0]});

    B.strokeStyle='rgba(30,14,4,.4)';B.beginPath();B.ellipse(x,y,r*.95,r*.68,0,5.7,7.9);B.stroke()}

    g=B.createRadialGradient(x-r*.4,y-r*.4,.5,x,y,r*1.2);g.addColorStop(0,'#b79a78');g.addColorStop(1,'#4e3a28');
    B.fillStyle='rgba(0,0,0,.35)';B.beginPath();B.ellipse(x+r*.7,y+r*.6,r*1.1,r*.6,0,0,6.283);B.fill();
    B.fillStyle=g;B.beginPath();B.ellipse(x,y,r,r*.75,0,0,6.283);B.fill()}
  for(i=0;i<4500;i++){B.globalAlpha=.1+rnd()*.18;B.fillStyle=rnd()<.5?'#3e2412':'#f4cf9a';B.fillRect(rnd()*W,rnd()*H,1+rnd()*1.5,1+rnd()*1.5)}

function init(n){
  if(n!=null)mi=n;M=MISSIONS[mi];FACT=M.f;tmr=0;
  S=[];U=[];shots=[];P=[];sel=null;over=null;aiT=M.ai;sd=7+mi*13;terrain();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)S.push({c:c,r:r,o:0,cap:0,who:0,f:false,t:0,sm:0});
  FACT.forEach(function(f){S[f[1]*COLS+f[0]].f=true});
  M.a.forEach(function(q){ix(q).o=1});M.b.forEach(function(q){ix(q).o=2});
  S.forEach(function(s){s.t=Math.random()*3});
  var i;for(i=0;i<M.n1;i++)spawn(ix(M.a[0]),1);for(i=0;i<M.n2;i++)spawn(ix(M.b[0]),2);
  menu();
}
function spawn(s,tm){
  var x=s.c*SW+SW-40,y=s.r*SH+SH-30;
  U.push({x:x,y:y,tm:tm,hp:40,tx:x,ty:y,cd:0,sel:false,a:tm===1?0:Math.PI,ph:Math.random()*6,mv:false});
  burst(x,y,6,'#ffe9a0',40,.4);
  if(s.f)send([U[U.length-1]],s);
}
function burst(x,y,n,c,sp,l){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=sp*(.3+Math.random());P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:l*(.6+Math.random()*.6),m:l,c:c,r:1.5+Math.random()*2})}}

function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();X.fill()}

function factory(s,c,dk){
  var x=s.c*SW+SW-58,y=s.r*SH+SH-60,on=s.o>0,i,g;
  g=X.createRadialGradient(x+24,y+42,2,x+24,y+42,38);g.addColorStop(0,'rgba(0,0,0,.5)');g.addColorStop(1,'rgba(0,0,0,0)');
  X.fillStyle=g;X.beginPath();X.ellipse(x+24,y+42,38,10,0,0,6.283);X.fill();
  g=X.createLinearGradient(x+32,0,x+42,0);g.addColorStop(0,'#6a6a64');g.addColorStop(1,'#33332f');X.fillStyle=g;rr(x+32,y-12,9,24,2);

  X.fillStyle='#111';rr(x+13,y+22,20,18,2);
  for(i=0;i<5;i++){X.fillStyle=i%2?'#e8c22a':'#222';X.fillRect(x+13+i*4,y+36,4,4)}
  X.fillStyle=on?'#ffe9a0':'#2a2a26';X.fillRect(x+4,y+14,6,4);X.fillRect(x+36,y+14,6,4);

}
function unit(u){
  var c=u.tm===1?ME:FOE,dk=u.tm===1?MED:FOED,lt=u.tm===1?'#9ad6ff':'#ffb890',x=u.x,y=u.y,sw=u.mv?Math.sin(u.ph):0,bob=u.mv?Math.abs(Math.sin(u.ph))*1.3:0,g;

  X.restore();
  if(u.hp<40){X.fillStyle='rgba(0,0,0,.6)';rr(x-10,y-21,20,4,2);X.fillStyle=u.hp>20?'#8fe05a':'#ff5a3c';rr(x-9,y-20,18*u.hp/40,2,1)}
}
function draw(){
  X.save();if(shk>0)X.translate((Math.random()-.5)*shk,(Math.random()-.5)*shk);X.drawImage(BG,0,0);
  S.forEach(function(s){
    var x=s.c*SW,y=s.r*SH,c=s.o===1?ME:s.o===2?FOE:NEU;
    var gr=X.createRadialGradient(x+SW/2,y+SH/2,10,x+SW/2,y+SH/2,SW*.75);gr.addColorStop(0,s.o?c+'18':'#0000');gr.addColorStop(1,s.o?c+'5a':'#0000');X.fillStyle=gr;X.fillRect(x,y,SW,SH);
    X.strokeStyle='rgba(255,240,210,.22)';X.lineWidth=1;X.setLineDash([4,5]);X.strokeRect(x+.5,y+.5,SW-1,SH-1);X.setLineDash([]);
    if(s.o){X.strokeStyle=c;X.lineWidth=2.5;X.globalAlpha=.9;
      [[x,y,1,1],[x+SW,y,-1,1],[x,y+SH,1,-1],[x+SW,y+SH,-1,-1]].forEach(function(q){X.beginPath();X.moveTo(q[0]+q[2]*16,q[1]);X.lineTo(q[0],q[1]);X.lineTo(q[0],q[1]+q[3]*16);X.stroke()});X.globalAlpha=1}
    flag(x+16,y+10,s.o?c:'#9a9a90');
    if(s.f)factory(s,s.o?c:'#8a8a80',s.o===1?MED:s.o===2?FOED:'#55554d');
    if(s.cap>0){var w=(SW-32)*Math.min(1,s.cap/2);X.fillStyle='rgba(0,0,0,.5)';X.fillRect(x+16,y+SH-12,SW-32,6);X.fillStyle=s.who===1?ME:FOE;X.fillRect(x+16,y+SH-12,w,6)}
    if(sel===s){X.strokeStyle='#fff';X.lineWidth=3;X.globalAlpha=.5+.5*Math.sin(T*6);X.strokeRect(x+4,y+4,SW-8,SH-8);X.globalAlpha=1}
  });
  U.slice().sort(function(a,b){return a.y-b.y}).forEach(unit);
  X.globalCompositeOperation='lighter';
  shots.forEach(function(h){
    var a=h.t/.12,mx=h.a.x+Math.cos(h.a.a)*15,my=h.a.y-9+Math.sin(h.a.a)*15,col=h.a.tm===1?'120,200,255':'255,170,90',g;
    X.lineCap='round';X.strokeStyle='rgba('+col+','+.55*a+')';X.lineWidth=6;X.beginPath();X.moveTo(mx,my);X.lineTo(h.x,h.y-4);X.stroke();
    X.strokeStyle='rgba(255,255,255,'+a+')';X.lineWidth=1.8;X.stroke();X.lineCap='butt';
    g=X.createRadialGradient(mx,my,0,mx,my,10);g.addColorStop(0,'rgba(255,245,190,'+a+')');g.addColorStop(1,'rgba(255,160,60,0)');X.fillStyle=g;X.beginPath();X.arc(mx,my,10,0,6.283);X.fill();
  });
  P.forEach(function(p){if(p.smoke)return;var k=p.l/p.m,r=p.r*(k+.6)*2.4,g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,'rgba(255,255,255,'+k*.9+')');g.addColorStop(.4,p.c);g.addColorStop(1,'rgba(0,0,0,0)');X.globalAlpha=k;X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,r,0,6.283);X.fill()});
  X.globalCompositeOperation='source-over';
  P.forEach(function(p){if(!p.smoke)return;var k=p.l/p.m,r=p.r*(2.4-k)*2,g=X.createRadialGradient(p.x,p.y,0,p.x,p.y,r);
    g.addColorStop(0,'rgba(90,90,85,.55)');g.addColorStop(1,'rgba(90,90,85,0)');X.globalAlpha=k*.7;X.fillStyle=g;X.beginPath();X.arc(p.x,p.y,r,0,6.283);X.fill()});
  X.globalAlpha=1;X.restore();
  if(M.sv&&!over){X.fillStyle='rgba(0,0,0,.55)';X.fillRect(W/2-90,8,180,30);X.fillStyle='#fff';X.font='bold 17px Trebuchet MS,Verdana,sans-serif';X.textAlign='center';X.fillText('Přežij: '+Math.max(0,Math.ceil(M.sv-tmr))+' s',W/2,29);X.textAlign='left'}
  if(over){
    X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,H/2-50,W,100);
    X.fillStyle='#fff';X.font='bold 28px Trebuchet MS,Verdana,sans-serif';X.textAlign='center';X.fillText(over,W/2,H/2+9);X.textAlign='left';
  }
  var m=0,f=0;U.forEach(function(q){q.tm===1?m++:f++});
  document.getElementById('nm').textContent=m;document.getElementById('nf').textContent=f;
  document.getElementById('sm').textContent=owned(1);document.getElementById('st').textContent=S.length;
}
function loop(t){
  var dt=Math.min(0.05,(t-(last||t))/1000);last=t;
  if(!over)step(dt);
  draw();requestAnimationFrame(loop);
}
function pos(e){var r=C.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
C.addEventListener('pointerdown',function(e){
  if(over)return;
  var p=pos(e),s=sec(p[0],p[1]);
  var mine=U.filter(function(u){return u.tm===1&&sec(u.x,u.y)===s});
  if(sel&&U.some(function(u){return u.sel})){
    if(s===sel&&mine.length){U.forEach(function(u){u.sel=false});sel=null;return}
    send(U.filter(function(u){return u.sel}),s);sel=null;
  }else if(mine.length){
    U.forEach(function(u){u.sel=false});mine.forEach(function(u){u.sel=true});sel=s;
  }
});
document.getElementById('all').onclick=function(){
  var mine=U.filter(function(u){return u.tm===1});
  if(!mine.length)return;
  mine.forEach(function(u){u.sel=true});sel=sec(mine[0].x,mine[0].y);
};
document.getElementById('rst').onclick=function(){init()};
function win(){try{var d=+localStorage.getItem('zm')||0;if(mi+1>d)localStorage.setItem('zm',mi+1)}catch(e){}menu()}
function menu(){
  var d=0;try{d=+localStorage.getItem('zm')||0}catch(e){}
  var el=document.getElementById('ms');el.innerHTML='';
  MISSIONS.forEach(function(m,i){var b=document.createElement('button');b.textContent=(i+1)+'. '+m.n;b.disabled=i>d;
    if(i===mi){b.style.background='var(--me)';b.style.color='#fff'}
    b.onclick=function(){init(i)};el.appendChild(b)});
  document.getElementById('md').textContent='Mise '+(mi+1)+': '+M.d;
}
init();requestAnimationFrame(loop);
})();
