<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zed Mini – dobývání sektorů</title>
<style>
:root{--bg:#e9e6dc;--fg:#23261f;--panel:#d8d4c6;--me:#1f6fb5;--foe:#c4501f;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#171a14;--fg:#e4e2d6;--panel:#262a21;--me:#5bb0f0;--foe:#f08a5a;color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 "Trebuchet MS",Verdana,sans-serif}
body{padding:env(safe-area-inset-top,0) 8px env(safe-area-inset-bottom,0);max-width:980px;margin:0 auto}
header{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline;justify-content:space-between;padding:10px 0}
h1{font-size:1.3rem;margin:0;letter-spacing:.02em}
#hud{display:flex;gap:14px;flex-wrap:wrap}
#hud b.me{color:var(--me)}#hud b.foe{color:var(--foe)}
canvas{width:100%;height:auto;display:block;border-radius:8px;touch-action:manipulation;box-shadow:0 2px 14px rgba(0,0,0,.35)}
.bar{display:flex;flex-wrap:wrap;gap:8px;padding:10px 0}
button{font:inherit;padding:8px 14px;border:2px solid var(--fg);background:var(--panel);color:var(--fg);border-radius:4px;cursor:pointer}
button:focus-visible{outline:3px solid var(--me);outline-offset:2px}
p.help{margin:0 0 12px;font-size:.9rem;max-width:70ch}
</style>
</head>
<body>
<header>
  <h1>Zed Mini</h1>
  <div id="hud">Moje roboty: <b class="me" id="nm">0</b> Nepřítel: <b class="foe" id="nf">0</b> Sektory: <b class="me" id="sm">0</b>/<span id="st">0</span></div>
</header>
<canvas id="c" width="960" height="600" aria-label="Herní plocha"></canvas>
<div class="bar">
  <button id="all">Vybrat všechny roboty</button>
  <button id="rst">Nová hra</button>
</div>
<p class="help">Klepni na sektor, ve kterém máš roboty, a vyber je. Pak klepni na cílový sektor. Sektor obsadíš, když v něm stojí jen tvoji roboti. Čím víc sektorů vlastníš, tím rychleji jedou tvoje továrny. Vyhraješ, když ovládneš všechny továrny.</p>
<script>
(function(){
var C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=600,COLS=8,ROWS=5,SW=W/COLS,SH=H/ROWS;
var ME='#2f8fe0',FOE='#e0502a',MED='#17598f',FOED='#8f2f14',NEU='#cfc9b8';
var S,U,shots,P,sel,over,last,aiT,T=0,BG=document.createElement('canvas'),B=BG.getContext('2d');
BG.width=W;BG.height=H;
var FACT=[[0,2],[7,2],[3,0],[4,4],[2,3],[5,1]];
var sd=7;function rnd(){sd=(sd*16807)%2147483647;return sd/2147483647}
function terrain(){
  var g=B.createLinearGradient(0,0,W,H);g.addColorStop(0,'#b07a4c');g.addColorStop(.5,'#9c6a40');g.addColorStop(1,'#a8764a');
  B.fillStyle=g;B.fillRect(0,0,W,H);
  var i,x,y,r;
  for(i=0;i<COLS*ROWS;i++){B.globalAlpha=.07;B.fillStyle=rnd()<.5?'#5a3a20':'#e0b27a';B.fillRect((i%COLS)*SW,(i/COLS|0)*SH,SW,SH)}
  B.globalAlpha=1;
  for(i=0;i<3500;i++){B.globalAlpha=.1+rnd()*.15;B.fillStyle=rnd()<.5?'#4a2d18':'#f0c892';B.fillRect(rnd()*W,rnd()*H,1+rnd()*2,1+rnd()*2)}
  for(i=0;i<16;i++){x=rnd()*W;y=rnd()*H;r=8+rnd()*22;
    B.globalAlpha=.35;B.fillStyle='#3d2514';B.beginPath();B.ellipse(x,y,r,r*.7,0,0,6.283);B.fill();
    B.globalAlpha=.5;B.strokeStyle='#e8c08a';B.lineWidth=2;B.beginPath();B.ellipse(x-1,y-1,r,r*.7,0,3.4,5.6);B.stroke()}
  for(i=0;i<45;i++){x=rnd()*W;y=rnd()*H;r=2+rnd()*5;
    B.globalAlpha=.4;B.fillStyle='#000';B.beginPath();B.ellipse(x+2,y+2,r,r*.6,0,0,6.283);B.fill();
    B.globalAlpha=.9;B.fillStyle='#6e5238';B.beginPath();B.ellipse(x,y,r,r*.7,0,0,6.283);B.fill();
    B.fillStyle='#9a7a58';B.beginPath();B.ellipse(x-1,y-1,r*.5,r*.35,0,0,6.283);B.fill()}
  B.globalAlpha=1;
  var v=B.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,W*.7);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(20,10,0,.45)');
  B.fillStyle=v;B.fillRect(0,0,W,H);
}
function init(){
  S=[];U=[];shots=[];P=[];sel=null;over=null;aiT=4;sd=7;terrain();
  for(var r=0;r<ROWS;r++)for(var c=0;c<COLS;c++)S.push({c:c,r:r,o:0,cap:0,who:0,f:false,t:0,sm:0});
  FACT.forEach(function(f){S[f[1]*COLS+f[0]].f=true});
  S[2*COLS].o=1;S[2*COLS+COLS-1].o=2;
  S.forEach(function(s){s.t=Math.random()*3});
  for(var i=0;i<3;i++){spawn(S[2*COLS],1);spawn(S[2*COLS+COLS-1],2)}
}
function spawn(s,tm){
  var x=s.c*SW+SW-40,y=s.r*SH+SH-30;
  U.push({x:x,y:y,tm:tm,hp:40,tx:x,ty:y,cd:0,sel:false,a:tm===1?0:Math.PI,ph:Math.random()*6,mv:false});
  burst(x,y,6,'#ffe9a0',40,.4);
  if(s.f)send([U[U.length-1]],s);
}
function burst(x,y,n,c,sp,l){for(var i=0;i<n;i++){var a=Math.random()*6.283,v=sp*(.3+Math.random());P.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:l*(.6+Math.random()*.6),m:l,c:c,r:1.5+Math.random()*2})}}
function sec(x,y){var c=Math.min(COLS-1,Math.max(0,x/SW|0)),r=Math.min(ROWS-1,Math.max(0,y/SH|0));return S[r*COLS+c]}
function send(list,s){list.forEach(function(u){u.tx=s.c*SW+18+Math.random()*(SW-36);u.ty=s.r*SH+18+Math.random()*(SH-36);u.sel=false})}
function owned(t){return S.filter(function(s){return s.o===t}).length}
function step(dt){
  var i,j,u,v,d,best,bd;
  T+=dt;
  S.forEach(function(s){
    if(!s.f||!s.o)return;
    s.t-=dt*(1+0.25*owned(s.o));
    s.sm-=dt;if(s.sm<=0){s.sm=.35;P.push({x:s.c*SW+SW-24,y:s.r*SH+SH-52,vx:6+Math.random()*6,vy:-18-Math.random()*10,l:1.4,m:1.4,c:'#555',r:3,smoke:1})}
    if(s.t<=0){s.t=6;if(U.filter(function(q){return q.tm===s.o}).length<70)spawn(s,s.o)}
  });
  for(i=0;i<U.length;i++){
    u=U[i];u.cd-=dt;best=null;bd=1e9;u.mv=false;
    for(j=0;j<U.length;j++){v=U[j];if(v.tm===u.tm)continue;d=Math.hypot(v.x-u.x,v.y-u.y);if(d<bd){bd=d;best=v}}
    if(best&&bd<70){
      u.a=Math.atan2(best.y-u.y,best.x-u.x);
      if(u.cd<=0){u.cd=0.8;best.hp-=9;shots.push({a:u,b:best,t:0.12,x:best.x,y:best.y});burst(best.x,best.y,3,'#ffd27a',60,.25)}
    }else{
      d=Math.hypot(u.tx-u.x,u.ty-u.y);
      if(d>3){u.a=Math.atan2(u.ty-u.y,u.tx-u.x);u.x+=(u.tx-u.x)/d*45*dt;u.y+=(u.ty-u.y)/d*45*dt;u.mv=true;u.ph+=dt*11}
    }
  }
  U.forEach(function(q){if(q.hp<=0){
    burst(q.x,q.y,16,'#ff9a3c',90,.7);burst(q.x,q.y,8,'#fff3c0',50,.4);burst(q.x,q.y,6,'#333',40,1);
    B.globalAlpha=.4;var g=B.createRadialGradient(q.x,q.y,0,q.x,q.y,16);g.addColorStop(0,'#000');g.addColorStop(1,'rgba(0,0,0,0)');B.fillStyle=g;B.fillRect(q.x-16,q.y-16,32,32);B.globalAlpha=1}});
  U=U.filter(function(q){return q.hp>0});
  shots=shots.filter(function(h){h.t-=dt;return h.t>0&&h.a.hp>0});
  P.forEach(function(p){p.l-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;if(!p.smoke){p.vx*=.94;p.vy*=.94}});
  P=P.filter(function(p){return p.l>0});
  if(sel&&!U.some(function(q){return q.sel}))sel=null;
  var cnt=S.map(function(){return[0,0,0]});
  U.forEach(function(q){var s=sec(q.x,q.y);cnt[s.r*COLS+s.c][q.tm]++});
  S.forEach(function(s,k){
    var a=cnt[k][1],b=cnt[k][2],w=a&&!b?1:b&&!a?2:0;
    if(w&&w!==s.o){if(s.who!==w){s.who=w;s.cap=0}s.cap+=dt*(w===1?a:b);if(s.cap>=2){s.o=w;s.cap=0;burst(s.c*SW+SW/2,s.r*SH+SH/2,18,w===1?ME:FOE,80,.8)}}
    else s.cap=Math.max(0,s.cap-dt);
  });
  aiT-=dt;
  if(aiT<=0){
    aiT=6;
    var foes=U.filter(function(q){return q.tm===2});
    if(foes.length>=3){
      var ax=0,ay=0;foes.forEach(function(q){ax+=q.x;ay+=q.y});ax/=foes.length;ay/=foes.length;
      var tg=null,td=1e9;
      S.forEach(function(s){if(s.o===2)return;var dd=Math.hypot(s.c*SW+SW/2-ax,s.r*SH+SH/2-ay)-(s.f?120:0);if(dd<td){td=dd;tg=s}});
      if(tg)send(foes,tg);
    }
  }
  var fs=S.filter(function(s){return s.f});
  if(fs.every(function(s){return s.o===1}))over='Vyhrál jsi! Všechny továrny jsou tvoje.';
  else if(fs.every(function(s){return s.o===2}))over='Prohrál jsi. Nepřítel ovládl všechny továrny.';
}
function rr(x,y,w,h,r){X.beginPath();X.moveTo(x+r,y);X.arcTo(x+w,y,x+w,y+h,r);X.arcTo(x+w,y+h,x,y+h,r);X.arcTo(x,y+h,x,y,r);X.arcTo(x,y,x+w,y,r);X.closePath();X.fill()}
function flag(x,y,c){
  X.strokeStyle='#2a2a2a';X.lineWidth=2;X.beginPath();X.moveTo(x,y+26);X.lineTo(x,y);X.stroke();
  X.fillStyle=c;X.beginPath();X.moveTo(x,y);
  for(var i=0;i<=16;i+=4)X.lineTo(x+i,y+Math.sin(T*5+i*.4+x)*1.8);
  for(i=16;i>=0;i-=4)X.lineTo(x+i,y+11+Math.sin(T*5+i*.4+x)*1.8);
  X.closePath();X.fill();X.strokeStyle='rgba(0,0,0,.4)';X.lineWidth=1;X.stroke();
}
function factory(s,c,dk){
  var x=s.c*SW+SW-52,y=s.r*SH+SH-54;
  X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(x+22,y+40,28,7,0,0,6.283);X.fill();
  X.fillStyle='#4a4a46';rr(x+30,y-10,8,22,2);
  X.fillStyle='#34342f';rr(x,y+4,42,34,3);
  X.fillStyle=c;rr(x-2,y,46,10,3);
  X.fillStyle=dk;X.fillRect(x-2,y+8,46,2);
  X.fillStyle='#14140f';rr(x+11,y+20,20,18,2);
  X.fillStyle='#d6d2c0';X.fillRect(x+4,y+14,5,3);X.fillRect(x+33,y+14,5,3);
  if(s.o){X.fillStyle='rgba(0,0,0,.5)';X.fillRect(x,y+42,42,4);X.fillStyle=c;X.fillRect(x,y+42,42*(1-Math.max(0,s.t)/6),4)}
}
function unit(u){
  var c=u.tm===1?ME:FOE,dk=u.tm===1?MED:FOED,sw=u.mv?Math.sin(u.ph)*3:0;
  X.fillStyle='rgba(0,0,0,.35)';X.beginPath();X.ellipse(u.x,u.y+7,8,3.5,0,0,6.283);X.fill();
  if(u.sel){X.strokeStyle='#fff';X.globalAlpha=.6+.4*Math.sin(T*8);X.lineWidth=2;X.beginPath();X.ellipse(u.x,u.y+7,13,6,0,0,6.283);X.stroke();X.globalAlpha=1}
  X.fillStyle='#1d1d1a';X.fillRect(u.x-6,u.y+1+sw,3.5,6);X.fillRect(u.x+2.5,u.y+1-sw,3.5,6);
  X.fillStyle=c;rr(u.x-7,u.y-7,14,11,3);
  X.fillStyle=dk;X.fillRect(u.x-7,u.y,14,2.5);
  X.save();X.translate(u.x,u.y-4);X.rotate(u.a);
  X.fillStyle='#262622';X.fillRect(0,-1.6,12,3.2);
  X.fillStyle=c;X.beginPath();X.arc(0,0,4.5,0,6.283);X.fill();
  X.strokeStyle='rgba(0,0,0,.5)';X.lineWidth=1;X.stroke();
  X.fillStyle='#fff';X.globalAlpha=.8;X.fillRect(1.5,-1.5,2,3);X.globalAlpha=1;
  X.restore();
  if(u.hp<40){X.fillStyle='rgba(0,0,0,.55)';X.fillRect(u.x-9,u.y-16,18,3);X.fillStyle=u.hp>20?'#8fe05a':'#ff5a3c';X.fillRect(u.x-9,u.y-16,18*u.hp/40,3)}
}
function draw(){
  X.drawImage(BG,0,0);
  S.forEach(function(s){
    var x=s.c*SW,y=s.r*SH,c=s.o===1?ME:s.o===2?FOE:NEU;
    X.globalAlpha=s.o?0.2:0.04;X.fillStyle=c;X.fillRect(x,y,SW,SH);X.globalAlpha=1;
    X.strokeStyle='rgba(255,240,210,.22)';X.lineWidth=1;X.setLineDash([4,5]);X.strokeRect(x+.5,y+.5,SW-1,SH-1);X.setLineDash([]);
    if(s.o){X.strokeStyle=c;X.lineWidth=2.5;X.globalAlpha=.9;
      [[x,y,1,1],[x+SW,y,-1,1],[x,y+SH,1,-1],[x+SW,y+SH,-1,-1]].forEach(function(q){X.beginPath();X.moveTo(q[0]+q[2]*16,q[1]);X.lineTo(q[0],q[1]);X.lineTo(q[0],q[1]+q[3]*16);X.stroke()});X.globalAlpha=1}
    flag(x+16,y+10,s.o?c:'#9a9a90');
    if(s.f)factory(s,s.o?c:'#8a8a80',s.o===1?MED:s.o===2?FOED:'#55554d');
    if(s.cap>0){var w=(SW-32)*Math.min(1,s.cap/2);X.fillStyle='rgba(0,0,0,.5)';X.fillRect(x+16,y+SH-12,SW-32,6);X.fillStyle=s.who===1?ME:FOE;X.fillRect(x+16,y+SH-12,w,6)}
    if(sel===s){X.strokeStyle='#fff';X.lineWidth=3;X.globalAlpha=.5+.5*Math.sin(T*6);X.strokeRect(x+4,y+4,SW-8,SH-8);X.globalAlpha=1}
  });
  U.slice().sort(function(a,b){return a.y-b.y}).forEach(unit);
  shots.forEach(function(h){
    X.lineCap='round';X.strokeStyle='rgba(255,220,120,.35)';X.lineWidth=5;X.beginPath();X.moveTo(h.a.x,h.a.y-4);X.lineTo(h.x,h.y);X.stroke();
    X.strokeStyle='#fff6d0';X.lineWidth=1.8;X.stroke();X.lineCap='butt';
    var mx=h.a.x+Math.cos(h.a.a)*13,my=h.a.y-4+Math.sin(h.a.a)*13;
    X.fillStyle='#ffe08a';X.beginPath();X.arc(mx,my,3.5,0,6.283);X.fill();
  });
  P.forEach(function(p){var k=p.l/p.m;X.globalAlpha=p.smoke?k*.45:k;X.fillStyle=p.c;X.beginPath();X.arc(p.x,p.y,p.r*(p.smoke?(2-k):k+.3),0,6.283);X.fill()});
  X.globalAlpha=1;
  if(over){
    X.fillStyle='rgba(0,0,0,.65)';X.fillRect(0,H/2-50,W,100);
    X.fillStyle='#fff';X.font='bold 28px Trebuchet MS,Verdana,sans-serif';X.textAlign='center';X.fillText(over,W/2,H/2+9);X.textAlign='left';
  }
  var m=0,f=0;U.forEach(function(q){q.tm===1?m++:f++});
  document.getElementById('nm').textContent=m;document.getElementById('nf').textContent=f;
  document.getElementById('sm').textContent=owned(1);document.getElementById('st').textContent=S.length;
}
function loop(t){
  var dt=Math.min(0.05,(t-(last||t))/1000);last=t;
  if(!over)step(dt);
  draw();requestAnimationFrame(loop);
}
function pos(e){var r=C.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]}
C.addEventListener('pointerdown',function(e){
  if(over)return;
  var p=pos(e),s=sec(p[0],p[1]);
  var mine=U.filter(function(u){return u.tm===1&&sec(u.x,u.y)===s});
  if(sel&&U.some(function(u){return u.sel})){
    if(s===sel&&mine.length){U.forEach(function(u){u.sel=false});sel=null;return}
    send(U.filter(function(u){return u.sel}),s);sel=null;
  }else if(mine.length){
    U.forEach(function(u){u.sel=false});mine.forEach(function(u){u.sel=true});sel=s;
  }
});
document.getElementById('all').onclick=function(){
  var mine=U.filter(function(u){return u.tm===1});
  if(!mine.length)return;
  mine.forEach(function(u){u.sel=true});sel=sec(mine[0].x,mine[0].y);
};
document.getElementById('rst').onclick=init;
init();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
